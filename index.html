<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Reads</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="2026 Reads">
<meta property="og:description" content="A curated reading list.">
<meta property="og:image" content="og-banner.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="2026 Reads">
<meta name="twitter:image" content="og-banner.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f4f1eb;
    color: #2a2a2a;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- NAV --- */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    background: transparent;
    z-index: 1000; display: flex; align-items: center; padding: 0 40px;
  }
  .nav-logo {
    font-family: 'Instrument Serif', serif; font-size: 1.2rem;
    color: #2a2a2a; text-decoration: none; cursor: pointer;
  }
  .nav-logo em { font-style: italic; }
  .nav-icons { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .nav-icons a { display: flex; align-items: center; color: #999; transition: color 0.2s; }
  .nav-icons a:hover { color: #2a2a2a; }
  .nav-icons a svg { width: 18px; height: 18px; }

  /* --- TIMELINE GRID --- */
  .timeline {
    max-width: 900px; margin: 0 auto;
    padding: 76px 48px 160px;
    display: grid; grid-template-columns: 60px 1fr; gap: 0 40px;
  }

  /* --- SIDEBAR --- */
  .tl-sidebar {
    position: sticky; top: 76px; align-self: start;
    display: flex; flex-direction: column; padding-top: 6px;
  }
  .tl-sidebar::before {
    content: ''; position: absolute; top: 0; right: -20px; bottom: 0;
    width: 1px; background: #ddd8ce;
  }
  .tl-month {
    font-family: 'DM Sans', sans-serif; font-size: 0.68rem;
    letter-spacing: 0.03em; color: #aaa; text-align: right;
    padding: 5px 0; cursor: pointer; transition: all 0.25s;
    position: relative; border: none; background: none;
  }
  .tl-month:hover { color: #666; }
  .tl-month.active { color: #2a2a2a; font-weight: 500; }
  .tl-month.active::after {
    content: ''; position: absolute; right: -24px; top: 50%;
    transform: translateY(-50%); width: 7px; height: 7px;
    border-radius: 50%; background: #2a2a2a;
  }

  /* --- MONTH SECTIONS --- */
  .month-section { margin-bottom: 72px; scroll-margin-top: 76px; }
  .month-header {
    font-family: 'Instrument Serif', serif; font-size: 6rem;
    font-style: italic; color: #2a2a2a; margin-bottom: 24px;
    line-height: 1;
  }
  .month-links { list-style: none; padding: 0; }
  .month-links li {
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .month-links li.visible { opacity: 1; transform: translateY(0); }

  /* --- LINK ROWS --- */
  .link-row {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 0; position: relative;
  }
  .link-favicon {
    width: 14px; height: 14px; border-radius: 3px;
    flex-shrink: 0; transition: opacity 0.15s;
  }
  .month-links a {
    color: #555; text-decoration: none;
    font-size: 0.98rem; font-weight: 400; line-height: 1.75;
    transition: all 0.15s; border-bottom: 1px solid transparent;
  }
  .month-links a:hover { color: #2a2a2a; border-bottom-color: #2a2a2a; }

  /* --- HOVER PREVIEW --- */
  .preview-card {
    position: fixed; pointer-events: none; z-index: 2000;
    opacity: 0; transform: translateY(8px) scale(0.95);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .preview-card.show { opacity: 1; transform: translateY(0) scale(1); }

  .pc-object {
    position: relative; display: flex; align-items: center;
    justify-content: center;
    filter: drop-shadow(0 16px 36px rgba(0,0,0,0.15));
  }
  .pc-object img.template-img { width: 100%; height: 100%; display: block; }

  .pc-object[data-type="newspaper"] { width: 420px; height: 322px; }
  .pc-object[data-type="magazine"]  { width: 260px; height: 364px; }
  .pc-object[data-type="paper"]     { width: 380px; height: 303px; }
  .pc-object[data-type="book"]      { width: 300px; height: 433px; }
  .pc-object[data-type="social"]    { width: 400px; height: 307px; }
  .pc-object[data-type="website"]   { width: 440px; height: 300px; }

  .pc-overlay {
    position: absolute; z-index: 2; display: flex;
    flex-direction: column; gap: 8px; padding: 20px; overflow: hidden;
  }
  .pc-overlay .pc-masthead {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.12em; color: rgba(0,0,0,0.35);
  }
  .pc-overlay .pc-title {
    font-family: 'Instrument Serif', serif; font-size: 1.3rem;
    line-height: 1.25; color: #1a1a1a;
    display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .pc-overlay .pc-source {
    font-family: 'DM Sans', sans-serif; font-size: 0.72rem;
    color: rgba(0,0,0,0.3); display: flex; align-items: center; gap: 6px;
  }
  .pc-overlay .pc-source img { width: 14px; height: 14px; border-radius: 2px; opacity: 0.5; }

  /* Newspaper */
  .pc-object[data-type="newspaper"] .pc-overlay {
    top: 10%; left: 8%; right: 8%; bottom: 14%;
    text-align: center; align-items: center; justify-content: center;
  }
  .pc-object[data-type="newspaper"] .pc-overlay .pc-masthead {
    font-size: 0.95rem; letter-spacing: 0.22em; color: rgba(40,30,15,0.75); font-weight: 700;
  }
  .pc-object[data-type="newspaper"] .pc-overlay .pc-title { font-size: 1.5rem; max-width: 340px; color: rgba(30,20,10,0.82); }
  .pc-object[data-type="newspaper"] .pc-overlay .pc-source { color: rgba(50,40,25,0.5); }

  /* Magazine */
  .pc-object[data-type="magazine"] .pc-overlay {
    top: 10%; left: 12%; right: 12%; bottom: 10%;
    text-align: center; align-items: center; justify-content: center;
  }
  .pc-object[data-type="magazine"] .pc-overlay .pc-masthead { font-size: 0.75rem; letter-spacing: 0.18em; color: rgba(0,0,0,0.3); }
  .pc-object[data-type="magazine"] .pc-overlay .pc-title { font-size: 1.4rem; max-width: 220px; }

  /* Paper */
  .pc-object[data-type="paper"] .pc-overlay { top: 10%; left: 10%; right: 10%; bottom: 14%; }
  .pc-object[data-type="paper"] .pc-overlay .pc-title {
    font-family: 'DM Sans', sans-serif; font-size: 1.15rem;
    font-weight: 500; line-height: 1.35; max-width: 280px;
  }
  .pc-object[data-type="paper"] .pc-overlay .pc-masthead { font-size: 0.65rem; color: rgba(0,0,0,0.25); }

  /* Book */
  .pc-object[data-type="book"] .pc-overlay {
    top: 14%; left: 12%; right: 16%; bottom: 14%;
    align-items: center; justify-content: center; text-align: center;
  }
  .pc-object[data-type="book"] .pc-overlay .pc-title { color: rgba(255,255,255,0.88); text-shadow: 0 1px 4px rgba(0,0,0,0.4); font-size: 1.3rem; max-width: 210px; }
  .pc-object[data-type="book"] .pc-overlay .pc-source { color: rgba(255,255,255,0.4); }
  .pc-object[data-type="book"] .pc-overlay .pc-source img { opacity: 0.4; }
  .pc-object[data-type="book"] .pc-overlay .pc-masthead { color: rgba(255,255,255,0.35); }

  /* Social */
  .pc-object[data-type="social"] .pc-overlay {
    top: 8%; left: 8%; right: 8%; bottom: 8%;
    align-items: center; justify-content: center; text-align: center;
  }
  .pc-object[data-type="social"] .pc-overlay .pc-title { font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 400; max-width: 280px; }
  .pc-object[data-type="social"] .pc-overlay .pc-masthead { color: rgba(0,0,0,0.3); }

  /* Website */
  .pc-object[data-type="website"] {
    background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.12);
    filter: none; flex-direction: column; align-items: stretch; justify-content: flex-start;
  }
  .pc-object[data-type="website"] .template-img { display: none; }
  .browser-chrome {
    height: 36px; background: #e8e8e8; display: none;
    align-items: center; padding: 0 14px; gap: 7px;
    flex-shrink: 0; border-bottom: 1px solid #ddd;
  }
  .pc-object[data-type="website"] .browser-chrome { display: flex; }
  .browser-chrome .dot { width: 11px; height: 11px; border-radius: 50%; }
  .browser-chrome .dot.red { background: #ff5f57; }
  .browser-chrome .dot.yellow { background: #febc2e; }
  .browser-chrome .dot.green { background: #28c840; }
  .pc-object[data-type="website"] .pc-overlay {
    position: relative; flex: 1; align-items: center; justify-content: center; text-align: center;
  }
  .pc-object[data-type="website"] .pc-overlay .pc-title { font-family: 'DM Sans', sans-serif; font-size: 1.15rem; font-weight: 500; color: #333; max-width: 320px; }
  .pc-object[data-type="website"] .pc-overlay .pc-masthead { color: #aaa; }
  .pc-object[data-type="website"] .pc-overlay .pc-source { color: #bbb; }

  /* Video */
  .pc-object[data-type="video"] {
    width: 500px; height: 320px; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center;
  }
  .pc-object[data-type="video"] .template-img { display: none; }
  .pc-object[data-type="video"] .pc-overlay {
    top: 0; left: 0; right: 0; bottom: 0;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(0,0,0,0.55);
  }
  .pc-object[data-type="video"] .pc-overlay .pc-title { color: #fff; font-size: 1.2rem; max-width: 340px; }
  .pc-object[data-type="video"] .pc-overlay .pc-masthead { color: rgba(255,255,255,0.4); }
  .play-btn {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: none;
    align-items: center; justify-content: center; margin-bottom: 12px;
  }
  .play-btn::after {
    content: ''; display: block; width: 0; height: 0;
    border-style: solid; border-width: 11px 0 11px 20px;
    border-color: transparent transparent transparent #333; margin-left: 4px;
  }

  /* --- DIM EFFECT --- */
  body.dim-active .month-links li { opacity: 0.08; transition: opacity 0.3s ease; }
  body.dim-active .month-links li.is-hovered { opacity: 1; }
  body.dim-active .month-header,
  body.dim-active .tl-sidebar { opacity: 0.12; transition: opacity 0.3s ease; }
  body.dim-active .month-section.has-hover .month-header { opacity: 0.5; }

  /* --- MOBILE --- */
  .mobile-view { display: none; }

  @media (max-width: 700px) {
    .timeline { display: none; }
    .navbar {
      padding: 0 16px; border-bottom: none;
      background: rgba(244,241,235,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .preview-card { display: none !important; }

    .mobile-view {
      display: flex; flex-direction: column; position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0; background: #f4f1eb;
    }

    .mv-carousel {
      flex: 1; display: flex; overflow-x: auto;
      scroll-snap-type: x mandatory; align-items: center;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .mv-carousel::-webkit-scrollbar { display: none; }

    .mv-slide {
      flex: 0 0 78vw; scroll-snap-align: center;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 0 8px; padding-bottom: 8vh;
      text-decoration: none; color: inherit;
      opacity: 0.2; transform: scale(0.88);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .mv-slide:first-child { margin-left: 11vw; }
    .mv-slide:last-child { margin-right: 11vw; }
    .mv-slide.in-focus { opacity: 1; transform: scale(1); }

    /* Artifact objects */
    .mc-object {
      position: relative; display: flex; align-items: center;
      justify-content: center; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.14));
      max-width: 78vw;
    }
    .mc-object img.mc-tpl { width: 100%; height: 100%; display: block; }
    .mc-overlay {
      position: absolute; z-index: 2; display: flex;
      flex-direction: column; gap: 6px; padding: 14px; overflow: hidden;
    }
    .mc-overlay .mc-masthead {
      font-family: 'DM Mono', monospace; font-size: 0.55rem;
      text-transform: uppercase; letter-spacing: 0.12em; color: rgba(0,0,0,0.35);
    }
    .mc-overlay .mc-title {
      font-family: 'Instrument Serif', serif; font-size: 1rem;
      line-height: 1.25; color: #1a1a1a;
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .mc-overlay .mc-source {
      font-size: 0.6rem; color: rgba(0,0,0,0.3);
      display: flex; align-items: center; gap: 4px;
    }
    .mc-overlay .mc-source img { width: 12px; height: 12px; border-radius: 2px; opacity: 0.5; }

    /* Per-type sizes */
    .mc-object[data-type="newspaper"] { width: min(72vw, 320px); aspect-ratio: 420/322; }
    .mc-object[data-type="magazine"]  { width: min(50vw, 210px); aspect-ratio: 260/364; }
    .mc-object[data-type="paper"]     { width: min(68vw, 300px); aspect-ratio: 380/303; }
    .mc-object[data-type="book"]      { width: min(48vw, 230px); aspect-ratio: 300/433; }
    .mc-object[data-type="social"]    { width: min(72vw, 310px); aspect-ratio: 400/307; }

    /* Newspaper */
    .mc-object[data-type="newspaper"] .mc-overlay {
      top: 10%; left: 8%; right: 8%; bottom: 14%;
      text-align: center; align-items: center; justify-content: center;
    }
    .mc-object[data-type="newspaper"] .mc-masthead { font-size: 0.7rem; letter-spacing: 0.22em; color: rgba(40,30,15,0.75); font-weight: 700; }
    .mc-object[data-type="newspaper"] .mc-title { font-size: 1.1rem; color: rgba(30,20,10,0.82); max-width: 260px; }
    .mc-object[data-type="newspaper"] .mc-source { color: rgba(50,40,25,0.5); }

    /* Magazine */
    .mc-object[data-type="magazine"] .mc-overlay {
      top: 10%; left: 12%; right: 12%; bottom: 10%;
      text-align: center; align-items: center; justify-content: center;
    }
    .mc-object[data-type="magazine"] .mc-masthead { font-size: 0.6rem; letter-spacing: 0.18em; color: rgba(0,0,0,0.3); }
    .mc-object[data-type="magazine"] .mc-title { font-size: 1.05rem; max-width: 180px; }

    /* Paper */
    .mc-object[data-type="paper"] .mc-overlay { top: 10%; left: 10%; right: 10%; bottom: 14%; }
    .mc-object[data-type="paper"] .mc-title { font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; line-height: 1.35; max-width: 220px; }
    .mc-object[data-type="paper"] .mc-masthead { font-size: 0.5rem; color: rgba(0,0,0,0.25); }

    /* Book */
    .mc-object[data-type="book"] .mc-overlay {
      top: 14%; left: 12%; right: 16%; bottom: 14%;
      align-items: center; justify-content: center; text-align: center;
    }
    .mc-object[data-type="book"] .mc-title { color: rgba(255,255,255,0.88); text-shadow: 0 1px 4px rgba(0,0,0,0.4); font-size: 1.05rem; max-width: 170px; }
    .mc-object[data-type="book"] .mc-source { color: rgba(255,255,255,0.4); }
    .mc-object[data-type="book"] .mc-source img { opacity: 0.4; }
    .mc-object[data-type="book"] .mc-masthead { color: rgba(255,255,255,0.35); }

    /* Social */
    .mc-object[data-type="social"] .mc-overlay {
      top: 8%; left: 8%; right: 8%; bottom: 8%;
      align-items: center; justify-content: center; text-align: center;
    }
    .mc-object[data-type="social"] .mc-title { font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 400; max-width: 230px; }
    .mc-object[data-type="social"] .mc-masthead { color: rgba(0,0,0,0.3); }

    /* Website */
    .mc-object[data-type="website"] {
      width: min(78vw, 340px); aspect-ratio: 440/300;
      background: #fff; border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.1);
      filter: none; flex-direction: column; align-items: stretch;
    }
    .mc-object[data-type="website"] .mc-tpl { display: none; }
    .mc-chrome {
      height: 28px; background: #e8e8e8; display: flex;
      align-items: center; padding: 0 10px; gap: 6px;
      flex-shrink: 0; border-bottom: 1px solid #ddd;
    }
    .mc-chrome .dot { width: 8px; height: 8px; border-radius: 50%; }
    .mc-chrome .dot.red { background: #ff5f57; }
    .mc-chrome .dot.yellow { background: #febc2e; }
    .mc-chrome .dot.green { background: #28c840; }
    .mc-object[data-type="website"] .mc-overlay {
      position: relative; flex: 1;
      align-items: center; justify-content: center; text-align: center;
    }
    .mc-object[data-type="website"] .mc-title { font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; color: #333; max-width: 260px; }
    .mc-object[data-type="website"] .mc-masthead { color: #aaa; }
    .mc-object[data-type="website"] .mc-source { color: #bbb; }

    /* Video */
    .mc-object[data-type="video"] {
      width: min(78vw, 380px); aspect-ratio: 16/9;
      border-radius: 10px; overflow: hidden;
      background-size: cover; background-position: center;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.2));
    }
    .mc-object[data-type="video"] .mc-tpl { display: none; }
    .mc-object[data-type="video"] .mc-overlay {
      top: 0; left: 0; right: 0; bottom: 0;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(0,0,0,0.55);
    }
    .mc-object[data-type="video"] .mc-title { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.5); font-size: 1rem; max-width: 260px; }
    .mc-object[data-type="video"] .mc-source { color: rgba(255,255,255,0.5); }
    .mc-object[data-type="video"] .mc-source img { opacity: 0.5; }

    /* Bottom panel */
    .mv-bottom {
      flex-shrink: 0; background: rgba(244,241,235,0.96);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .mv-info {
      display: flex; align-items: baseline; gap: 8px;
      padding: 10px 20px 4px; min-height: 28px;
    }
    .mv-current-month {
      font-family: 'Instrument Serif', serif; font-style: italic;
      font-size: 0.9rem; color: #2a2a2a; flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .mv-timeline { padding: 4px 20px 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .mv-timeline::-webkit-scrollbar { display: none; }
    .mv-tl-track {
      display: flex; align-items: center; position: relative; min-width: max-content;
    }
    .mv-tl-track::before {
      content: ''; position: absolute; top: 50%; left: 8px; right: 8px;
      height: 1px; background: rgba(0,0,0,0.08);
    }
    .mv-dot {
      width: 26px; height: 26px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; flex-shrink: 0;
      position: relative; z-index: 1;
    }
    .mv-dot::after {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: rgba(0,0,0,0.12); transition: all 0.25s ease;
    }
    .mv-dot.active::after {
      width: 11px; height: 11px; background: #2a2a2a;
      box-shadow: 0 0 0 3px rgba(42,42,42,0.08);
    }
    .mv-tl-gap {
      width: 20px; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }
    .mv-tl-gap::after {
      content: ''; width: 1.5px; height: 16px;
      background: rgba(0,0,0,0.12); border-radius: 1px;
    }

    /* Month picker */
    .mv-current-month {
      cursor: pointer; display: flex; align-items: center; gap: 3px;
    }
    .mv-month-chevron {
      width: 10px; height: 10px; opacity: 0.4; transition: transform 0.2s ease;
      flex-shrink: 0; margin-top: 1px;
    }
    .mv-current-month.picker-open .mv-month-chevron { transform: rotate(180deg); }
    .mv-month-picker {
      position: absolute; bottom: 100%; left: 16px;
      background: rgba(244,241,235,0.97); backdrop-filter: blur(20px);
      border-radius: 12px; padding: 8px 4px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
      display: none; flex-direction: column; gap: 2px; min-width: 120px;
      z-index: 10;
    }
    .mv-month-picker.show { display: flex; }
    .mv-month-picker button {
      border: none; background: none; font-family: 'Instrument Serif', serif;
      font-style: italic; font-size: 1rem; color: #999; padding: 6px 16px;
      text-align: left; cursor: pointer; border-radius: 8px;
      transition: all 0.15s;
    }
    .mv-month-picker button:hover,
    .mv-month-picker button.active { color: #2a2a2a; background: rgba(0,0,0,0.04); }

    /* View toggle */
    .mv-view-toggle {

// --- TYPOLOGY ---
const TYPE_RULES = {
  paper: ['arxiv.org','papers.ssrn.com','researchgate.net','mdpi.com','academic.oup.com','ssrn.com'],
  newspaper: ['nytimes.com','wsj.com'],
  magazine: ['newyorker.com','harpers.org','hollywoodreporter.com','thecut.com','nature.com','e-flux.com','placesjournal.org','thereader.mitpress.mit.edu','theconversation.com','sloanreview.mit.edu','nplusonemag.com','itsnicethat.com'],
  book: ['strandbooks.com','rlhfbook.com'],
  video: ['youtube.com','youtu.be','vimeo.com'],
  social: ['x.com','twitter.com']
};
const MASTHEAD_MAP = {
  'nytimes.com':'The New York Times','newyorker.com':'The New Yorker','wsj.com':'The Wall Street Journal',
  'harpers.org':"Harper's Magazine",'nature.com':'Nature','hollywoodreporter.com':'The Hollywood Reporter',
  'thecut.com':'The Cut','arxiv.org':'arXiv','ssrn.com':'SSRN','researchgate.net':'ResearchGate',
  'sloanreview.mit.edu':'MIT Sloan Review','nplusonemag.com':'n+1',
  'thereader.mitpress.mit.edu':'MIT Press Reader','e-flux.com':'e-flux',
  'placesjournal.org':'Places Journal','academic.oup.com':'Oxford Academic',
};
const TEMPLATE_MAP = { newspaper:'templates/newspaper.png', paper:'templates/paper.png', book:'templates/book.png', magazine:'templates/magazine.png', social:'templates/ipad.png', video:null, website:null };
const SIZE_MAP = { newspaper:[420,322], magazine:[260,364], paper:[380,303], book:[300,433], social:[400,307], website:[440,300], video:[500,320] };

function getDomain(url) { try { return new URL(url).hostname.replace('www.',''); } catch { return ''; } }
function getFavicon(url) { try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=32`; } catch { return ''; } }
function getYouTubeId(url) { const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/); return m ? m[1] : null; }
function classifyUrl(url) {
  const h = getDomain(url); const p = new URL(url).pathname;
  if (p.endsWith('.pdf')) return 'paper';
  for (const [type, domains] of Object.entries(TYPE_RULES)) { for (const d of domains) { if (h === d || h.endsWith('.'+d)) return type; } }
  return 'website';
}
function getMasthead(url) {
  const h = getDomain(url);
  for (const [d, name] of Object.entries(MASTHEAD_MAP)) { if (h === d || h.endsWith('.'+d)) return name; }
  return h;
}

// --- DATA ---
const filledMonths = Object.keys(data).map(Number).sort((a,b) => a-b);
const latestMonth = filledMonths[filledMonths.length - 1];

// --- SIDEBAR ---
const sidebar = document.getElementById('tl-sidebar');
const content = document.getElementById('tl-content');

[...filledMonths].reverse().forEach(i => {
  const btn = document.createElement('button');
  btn.className = 'tl-month has-data' + (i === latestMonth ? ' active' : '');
  btn.textContent = monthAbbr[i];
  btn.dataset.month = i;
  btn.addEventListener('click', () => {
    const el = document.getElementById('month-' + i);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  sidebar.appendChild(btn);
});

// --- MONTH SECTIONS ---
[...filledMonths].reverse().forEach(idx => {
  const links = data[idx];
  const section = document.createElement('div');
  section.className = 'month-section';
  section.id = 'month-' + idx;

  const reversed = [...links].reverse();
  section.innerHTML = `
    <div class="month-header">${monthNames[idx]}</div>
    <ul class="month-links">
      ${reversed.map((l, i) => {
        const type = classifyUrl(l.u);
        const favicon = getFavicon(l.u);
        return `<li style="transition-delay:${Math.min(i*30,400)}ms">
          <div class="link-row" data-url="${l.u}" data-title="${l.t.replace(/"/g,'&quot;')}" data-type="${type}">
            <img class="link-favicon" src="${favicon}" alt="" loading="lazy" width="14" height="14">
            <a href="${l.u}" target="_blank" rel="noopener">${l.t}</a>
          </div>
        </li>`;
      }).join('')}
    </ul>`;
  content.appendChild(section);
});

// --- SCROLL ANIMATIONS ---
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.month-links li').forEach(li => obs.observe(li));

// --- SIDEBAR TRACKING ---
const sidebarBtns = [...sidebar.querySelectorAll('.tl-month')];
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  let activeIdx = filledMonths[filledMonths.length - 1];
  [...filledMonths].reverse().forEach(idx => {
    const el = document.getElementById('month-' + idx);
    if (el && y >= el.offsetTop - 140) activeIdx = idx;
  });
  sidebarBtns.forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.month) === activeIdx));
}, { passive: true });

document.getElementById('nav-logo').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// --- HOVER PREVIEW ---
const card = document.getElementById('preview-card');
const pcObject = document.getElementById('pc-object');
const pcTemplate = document.getElementById('pc-template');
const pcTitle = document.getElementById('pc-title');
const pcMasthead = document.getElementById('pc-masthead');
const pcDomain = document.getElementById('pc-domain');
const pcFavicon = document.getElementById('pc-favicon');
const pcPlaybtn = document.getElementById('pc-playbtn');
let cardVisible = false;

function showCard(row, e) {
  const url = row.dataset.url, title = row.dataset.title, type = row.dataset.type;
  pcObject.dataset.type = type;
  const tpl = TEMPLATE_MAP[type];
  pcTemplate.src = tpl || ''; pcTemplate.style.display = tpl ? 'block' : 'none';
  if (type === 'video') {
    const ytId = getYouTubeId(url);
    pcObject.style.backgroundImage = ytId ? `url(https://img.youtube.com/vi/${ytId}/mqdefault.jpg)` : '';
    pcPlaybtn.style.display = 'flex';
  } else { pcObject.style.backgroundImage = ''; pcPlaybtn.style.display = 'none'; }
  pcMasthead.textContent = getMasthead(url);
  pcTitle.textContent = title;
  pcFavicon.src = getFavicon(url);
  pcDomain.textContent = getDomain(url);
  positionCard(e); card.classList.add('show'); cardVisible = true;
  document.body.classList.add('dim-active');
  const prev = document.querySelector('.is-hovered'); if (prev) prev.classList.remove('is-hovered');
  const prevBlock = document.querySelector('.month-section.has-hover'); if (prevBlock) prevBlock.classList.remove('has-hover');
  const li = row.closest('li'); if (li) li.classList.add('is-hovered');
  const block = row.closest('.month-section'); if (block) block.classList.add('has-hover');
}

function hideCard() {
  card.classList.remove('show'); cardVisible = false;
  document.body.classList.remove('dim-active');
  const prev = document.querySelector('.is-hovered'); if (prev) prev.classList.remove('is-hovered');
  const prevBlock = document.querySelector('.month-section.has-hover'); if (prevBlock) prevBlock.classList.remove('has-hover');
}

function positionCard(e) {
  const pad = 24, [w, h] = SIZE_MAP[pcObject.dataset.type] || [400,300];
  let x = e.clientX + pad, y = e.clientY - h/2;
  if (x + w + pad > window.innerWidth) x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 10) y = window.innerHeight - h - 10;
  if (y < 10) y = 10;
  card.style.left = x + 'px'; card.style.top = y + 'px';
}

document.addEventListener('mouseover', e => { const row = e.target.closest('.link-row'); if (row) showCard(row, e); });
document.addEventListener('mousemove', e => { if (cardVisible) positionCard(e); });
document.addEventListener('mouseout', e => { const row = e.target.closest('.link-row'); if (row && !row.contains(e.relatedTarget)) hideCard(); });

// --- MOBILE ---
let mobileBuilt = false;
function buildMobileView() {
  if (mobileBuilt || window.innerWidth > 700) return;
  mobileBuilt = true;

  const carousel = document.getElementById('mv-carousel');
  const currentMonthEl = document.getElementById('mv-current-month');
  const monthTextEl = document.getElementById('mv-month-text');
  const track = document.getElementById('mv-tl-track');

  const flat = [];
  const monthRanges = {};
  const orderedMonths = [];
  [...filledMonths].reverse().forEach(idx => {
    const start = flat.length;
    orderedMonths.push(monthNames[idx]);
    [...data[idx]].reverse().forEach(l => flat.push({ t: l.t, u: l.u, month: monthNames[idx] }));
    monthRanges[monthNames[idx]] = { start, end: flat.length - 1 };
  });

  // Carousel
  let lastMonth = '';
  carousel.innerHTML = flat.map((item, i) => {
    const type = classifyUrl(item.u), domain = getDomain(item.u), favicon = getFavicon(item.u);
    const tpl = TEMPLATE_MAP[type], ytId = type==='video' ? getYouTubeId(item.u) : null;
    const masthead = getMasthead(item.u);
    lastMonth = item.month;

    const overlay = `<div class="mc-overlay"><div class="mc-masthead">${masthead}</div>${type==='video'?'<div class="play-btn" style="display:flex"></div>':''}<div class="mc-title">${item.t}</div><div class="mc-source"><img src="${favicon}" alt="" width="12" height="12">${domain}</div></div>`;

    let obj = '';
    if (type==='video' && ytId) obj = `<div class="mc-object" data-type="video" style="background-image:url(https://img.youtube.com/vi/${ytId}/mqdefault.jpg)">${overlay}</div>`;
    else if (type==='website') obj = `<div class="mc-object" data-type="website"><div class="mc-chrome"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>${overlay}</div>`;
    else if (tpl) obj = `<div class="mc-object" data-type="${type}"><img class="mc-tpl" src="${tpl}" alt="">${overlay}</div>`;

    return `<a class="mv-slide${i===0?' in-focus':''}" data-idx="${i}" href="${item.u}" target="_blank" rel="noopener">${obj}</a>`;
  }).join('');

  // Dot timeline
  let dotLM = '';
  track.innerHTML = flat.map((item, i) => {
    const gap = item.month !== dotLM && dotLM ? '<div class="mv-tl-gap"></div>' : '';
    dotLM = item.month;
    return gap + `<div class="mv-dot${i===0?' active':''}" data-idx="${i}"></div>`;
  }).join('');

  monthTextEl.textContent = flat[0]?.month || '';

  const slides = [...carousel.querySelectorAll('.mv-slide')];
  const dots = [...track.querySelectorAll('.mv-dot')];
  let currentIdx = 0, syncing = false;

  function setActive(idx) {
    if (idx === currentIdx && dots[idx]?.classList.contains('active')) return;
    currentIdx = idx;
    slides.forEach((s, i) => s.classList.toggle('in-focus', i === idx));
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    // Update month
    const month = flat[idx].month;
    if (monthTextEl.textContent !== month) {
      currentMonthEl.style.opacity = '0';
      setTimeout(() => { monthTextEl.textContent = month; currentMonthEl.style.opacity = '1'; }, 100);
    }
    dots[idx]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  function scrollTo(idx) {
    const s = slides[idx]; if (!s) return;
    syncing = true; setActive(idx);
    carousel.scrollTo({ left: s.offsetLeft - (carousel.offsetWidth - s.offsetWidth)/2, behavior: 'smooth' });
    setTimeout(() => syncing = false, 500);
  }

  carousel.addEventListener('scroll', () => {
    if (syncing) return;
    const center = carousel.scrollLeft + carousel.offsetWidth/2;
    let best = 0, bestD = Infinity;
    slides.forEach((s, i) => { const d = Math.abs(s.offsetLeft + s.offsetWidth/2 - center); if (d < bestD) { bestD = d; best = i; } });
    setActive(best);
  }, { passive: true });

  track.addEventListener('click', e => { const d = e.target.closest('.mv-dot'); if (d) scrollTo(parseInt(d.dataset.idx)); });

  // Touch drag
  let dragging = false;
  function dotAtX(x) {
    let closest = null, cd = Infinity;
    for (const d of dots) { const r = d.getBoundingClientRect(), dist = Math.abs(x - (r.left+r.width/2)); if (dist < cd) { cd = dist; closest = d; } }
    return cd < 30 ? closest : null;
  }
  track.addEventListener('touchstart', e => { dragging = true; const d = dotAtX(e.touches[0].clientX); if (d) scrollTo(parseInt(d.dataset.idx)); }, { passive: true });
  track.addEventListener('touchmove', e => { if (!dragging) return; e.preventDefault(); const d = dotAtX(e.touches[0].clientX); if (d) { const i = parseInt(d.dataset.idx); if (i !== currentIdx) scrollTo(i); } }, { passive: false });
  track.addEventListener('touchend', () => dragging = false);
  track.addEventListener('touchcancel', () => dragging = false);

  // --- LIST VIEW ---
  const listEl = document.getElementById('mv-list');
  let listHTML = '';
  [...filledMonths].reverse().forEach(idx => {
    listHTML += `<div class="mv-list-month">${monthNames[idx]}</div>`;
    [...data[idx]].reverse().forEach(l => {
      const fav = getFavicon(l.u);
      listHTML += `<a href="${l.u}" target="_blank" rel="noopener"><img src="${fav}" alt="" width="14" height="14" loading="lazy">${l.t}</a>`;
    });
  });
  listEl.innerHTML = listHTML;

  // --- VIEW TOGGLE ---
  const toggleBtn = document.getElementById('mv-view-toggle');
  const timelineWrap = document.getElementById('mv-timeline-wrap');
  let isListView = false;
  const listIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
  const cardIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';

  toggleBtn.addEventListener('click', () => {
    isListView = !isListView;
    if (isListView) {
      carousel.classList.add('hidden');
      listEl.classList.add('show');
      timelineWrap.style.display = 'none';
      toggleBtn.innerHTML = cardIcon;
    } else {
      carousel.classList.remove('hidden');
      listEl.classList.remove('show');
      timelineWrap.style.display = '';
      toggleBtn.innerHTML = listIcon;
    }
  });

  // --- MONTH PICKER ---
  const pickerEl = document.getElementById('mv-month-picker');
  pickerEl.innerHTML = orderedMonths.map(m =>
    `<button data-month="${m}"${m === flat[0]?.month ? ' class="active"' : ''}>${m}</button>`
  ).join('');

  currentMonthEl.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = pickerEl.classList.toggle('show');
    currentMonthEl.classList.toggle('picker-open', isOpen);
  });

  function updateMonthLabel(month) {
    if (monthTextEl.textContent !== month) {
      currentMonthEl.style.opacity = '0';
      setTimeout(() => { monthTextEl.textContent = month; currentMonthEl.style.opacity = '1'; }, 100);
    }
    pickerEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.month === month));
  }

  pickerEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const month = btn.dataset.month;
    pickerEl.classList.remove('show');
    currentMonthEl.classList.remove('picker-open');
    updateMonthLabel(month);

    if (isListView) {
      const headers = listEl.querySelectorAll('.mv-list-month');
      for (const h of headers) {
        if (h.textContent === month) { h.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      }
    } else {
      const range = monthRanges[month];
      if (range) scrollTo(range.start);
    }
  });

  // Track scroll in list view to update month label
  listEl.addEventListener('scroll', () => {
    if (!isListView) return;
    const headers = listEl.querySelectorAll('.mv-list-month');
    let activeMonth = '';
    for (const h of headers) {
      if (h.getBoundingClientRect().top <= 80) activeMonth = h.textContent;
    }
    if (activeMonth) updateMonthLabel(activeMonth);
  }, { passive: true });

  document.addEventListener('click', () => {
    pickerEl.classList.remove('show');
    currentMonthEl.classList.remove('picker-open');
  });

}

buildMobileView();
window.addEventListener('resize', buildMobileView);


</script>
<script type="module">
import { WebHaptics } from 'https://cdn.jsdelivr.net/npm/web-haptics@0.0.6/dist/index.mjs';

if (window.innerWidth <= 700) {
  const h = new WebHaptics();

  // Carousel snap → selection tick
  const car = document.getElementById('mv-carousel');
  if (car) {
    let lastSnap = 0;
    car.addEventListener('scroll', () => {
      const center = car.scrollLeft + car.offsetWidth / 2;
      const slides = car.querySelectorAll('.mv-slide');
      let best = 0, bestD = Infinity;
      slides.forEach((s, i) => { const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - center); if (d < bestD) { bestD = d; best = i; } });
      if (best !== lastSnap) { lastSnap = best; h.trigger('selection'); }
    }, { passive: true });
  }

  // Dot timeline drag
  const track = document.getElementById('mv-tl-track');
  if (track) {
    track.addEventListener('touchstart', () => h.trigger('light'), { passive: true });
  }

  // Month picker open/close
  const monthEl = document.getElementById('mv-current-month');
  if (monthEl) {
    monthEl.addEventListener('click', () => h.trigger('rigid'));
  }

  // Month picker selection
  const picker = document.getElementById('mv-month-picker');
  if (picker) {
    picker.addEventListener('click', e => { if (e.target.closest('button')) h.trigger('medium'); });
  }

  // View toggle
  const toggle = document.getElementById('mv-view-toggle');
  if (toggle) {
    toggle.addEventListener('click', () => h.trigger('success'));
  }

  // List view link taps
  const listEl = document.getElementById('mv-list');
  if (listEl) {
    listEl.addEventListener('click', e => { if (e.target.closest('a')) h.trigger('light'); });
  }
}
</script>
